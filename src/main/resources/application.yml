# MS-Alertas — configuración principal (spec 004-alertas)
# Las credenciales y secretos se inyectan SIEMPRE por variables de entorno.

server:
  port: ${ALERT_APP_PORT:8082}

spring:
  application:
    name: ms-alertas
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/alertas_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:terrahome}
    password: ${DB_PASSWORD:terrahome}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# JWT (constitución III): MS-Alertas SOLO VALIDA tokens emitidos por
# MS-Usuarios. La clave compartida NUNCA se versiona; se lee SOLO de
# JWT_SECRET (>= 32 caracteres). Sin la variable, el arranque falla (fail-fast).
app:
  jwt:
    secret: ${JWT_SECRET}

# Integración con el catálogo (spec FR-008, timeout 3 s documentado).
catalogo:
  url: ${CATALOGO_URL:http://localhost:8081}
  timeout-ms: 3000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.terrahome.msalertas: DEBUG
    org.flywaydb: INFO
