# Perfil dev nativo (sin Docker): H2 en ARCHIVO (./data) en modo MySQL.
# Persiste entre reinicios: las alertas no se borran al apagar.
# Para empezar de cero: apagar el servicio y borrar ./data.
# El resto (JWT, JPA, Flyway, catalogo) se hereda de application.yml.

spring:
  datasource:
    url: jdbc:h2:file:./data/alertasdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

logging:
  level:
    com.terrahome.msalertas: DEBUG
