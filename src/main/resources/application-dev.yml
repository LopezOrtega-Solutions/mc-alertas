# Perfil dev nativo (sin Docker): H2 en memoria en modo MySQL.
# El resto (JWT, JPA, Flyway, catalogo) se hereda de application.yml.

spring:
  datasource:
    url: jdbc:h2:mem:alertasdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

logging:
  level:
    com.terrahome.msalertas: DEBUG
